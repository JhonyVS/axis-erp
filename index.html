<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axis ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      // Kept inline and dependency-free on purpose — a module import would be too late.
      //
      // The unwrapping matters: zustand's persist middleware stores { state, version },
      // so reading the top level finds nothing, silently falls through to the OS
      // preference, and produces exactly the flash this script exists to prevent.
      try {
        var raw = JSON.parse(localStorage.getItem('axis.theme') || '{}');
        var s = raw.state || raw;
        if (s.theme) document.documentElement.setAttribute('data-theme', s.theme);
        var dark = s.mode === 'dark' || (s.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (s.density) document.documentElement.setAttribute('data-density', s.density);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
